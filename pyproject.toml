[project]
name = "vpro"
version = "0.1.0"
description = "OpenVINO-first inference backend for the vPRO photo booth"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
	"openvino>=2026.4,<2026.5",
	"opencv-python>=4.10",
	"ultralytics>=8.3.0",
]

[project.optional-dependencies]
gen = [
	"optimum[openvino]>=1.23.0",
	"diffusers>=0.30.0",
	"accelerate>=0.33.0",
	"pillow>=10.0.0",
	"transformers>=4.39.1,<5.0",
]
kiosk = [
	"segno>=1.6",
	"fastapi>=0.115",
	"uvicorn>=0.30",
]
delivery = [
	"boto3>=1.35",
]

[project.scripts]
vpro = "vpro.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = []
